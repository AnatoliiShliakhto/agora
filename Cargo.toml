[workspace]
resolver = "3"
members = [
    "crates/adapters",
    "crates/api",
    "crates/bus",
    "crates/client",
    "crates/contracts",
    "crates/domain",
    "crates/eventstore",
    "crates/ledger",
    "crates/loadgen",
    "crates/matching",
    "crates/protocol",
    "crates/resilience",
    "crates/runtime",
    "crates/server",
    "crates/telemetry",
    "crates/testkit",
]
# `fuzz/` is a separate workspace: needs nightly and must not affect stable builds.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Anatolii Shliakhto <a.shlyakhto@gmail.com>"]
repository = "https://github.com/AnatoliiShliakhto/agora"
homepage = "https://github.com/AnatoliiShliakhto/agora"
keywords = ["exchange", "matching-engine", "event-sourcing", "trading", "simulation"]
categories = ["finance", "simulation"]
publish = false

# ---------------------------------------------------------------------------
# Dependencies: every version is pinned here once; crates use `workspace = true`.
# Keep alphabetical inside each group.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Internal crates.
agora-adapters = { path = "crates/adapters" }
agora-api = { path = "crates/api" }
agora-bus = { path = "crates/bus" }
agora-client = { path = "crates/client" }
agora-contracts = { path = "crates/contracts" }
agora-domain = { path = "crates/domain" }
agora-eventstore = { path = "crates/eventstore" }
agora-ledger = { path = "crates/ledger" }
agora-matching = { path = "crates/matching" }
agora-protocol = { path = "crates/protocol" }
agora-resilience = { path = "crates/resilience" }
agora-runtime = { path = "crates/runtime" }
agora-telemetry = { path = "crates/telemetry" }
agora-testkit = { path = "crates/testkit" }

# Async runtime & actors.
actix = "0.13"
actix-rt = "2.12"
futures = "0.3"
tokio = { version = "1.53", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP / API.
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "request-id", "timeout"] }
utoipa = { version = "5", features = ["axum_extras"] }

# Messaging & persistence.
async-nats = "0.50"
postcard = { version = "1.1", features = ["alloc"] }

# Serialization & data.
bytes = "1.12"
rust_decimal = { version = "1.42", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
ulid = { version = "3", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }

# Concurrency & memory.
arc-swap = "1.9"
crossbeam = "0.8"
crossbeam-queue = "0.3"
mimalloc = "0.1"
parking_lot = "0.12"
rtrb = "0.4"
slotmap = "1.1"
smallvec = "1"

# Errors, config, CLI.
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
humantime = "2"
secrecy = { version = "0.10", features = ["serde"] }
thiserror = "2"

# Observability.
hdrhistogram = "7"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
tracing = "0.1"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Resilience & timing.
backon = "1"
governor = "0.10"
jiff = { version = "0.2", features = ["serde"] }
rand = "0.10"

# Integrity.
blake3 = "1"
crc32fast = "1"

# Utilities.
ahash = "0.8"
async-trait = "0.1"
bon = "3"
derive_more = { version = "2", features = ["display", "from", "into", "as_ref", "deref"] }
indexmap = "2"
strum = { version = "0.28", features = ["derive"] }

# Testing & benchmarking.
criterion = { version = "0.8", features = ["html_reports"] }
fail = "0.5"
insta = { version = "1", features = ["json", "redactions"] }
loom = "0.7"
mockall = "0.15"
pretty_assertions = "1"
proptest = "1"
rstest = "0.26"
test-log = { version = "0.2", features = ["trace"] }
turmoil = "0.7"
wiremock = "0.6"

# ---------------------------------------------------------------------------
# Lints. Applied to every crate via `[lints] workspace = true`.
# Local overrides go through `#[expect(lint, reason = "...")]`, never bare `#[allow]`.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
# Lint groups (priority -1 so single lints below override group members).
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "warn", priority = -1 }

missing_docs = "deny"
unsafe_code = "deny"            # crates that need it opt back in with `#![allow(unsafe_code, reason = "...")]` + SAFETY docs
unsafe_op_in_unsafe_fn = "deny"

let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_debug_implementations = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
unescaped_backticks = "warn"

[workspace.lints.clippy]
# Groups.
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# --- Finance safety: no floats, no silent arithmetic, no panics in library code.
float_arithmetic = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
arithmetic_side_effects = "warn" # `deny` at crate level in domain/matching/ledger/contracts
integer_division = "warn"
modulo_arithmetic = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
todo = "warn"
indexing_slicing = "warn"
exit = "deny"

# --- Unsafe hygiene.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"

# --- Concurrency hygiene (hot path is single-writer, message passing).
rc_mutex = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"

# --- Code hygiene.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
clone_on_ref_ptr = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
str_to_string = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"
missing_assert_message = "warn"
tests_outside_test_module = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
renamed_function_params = "warn"
semicolon_inside_block = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
format_push_string = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
large_include_file = "warn"
map_err_ignore = "warn"
pathbuf_init_then_push = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
self_named_module_files = "deny"
string_lit_chars_any = "warn"
suspicious_xor_used_as_pow = "warn"
try_err = "warn"
unused_result_ok = "warn"

# --- Pedantic/nursery members that hurt more than help here.
module_name_repetitions = "allow"     # DDD naming: `order::OrderId` is intentional
multiple_crate_versions = "allow"     # enforced by cargo-deny instead
redundant_pub_crate = "allow"         # conflicts with `unreachable_pub`
option_if_let_else = "allow"          # usually less readable than the `if let`
significant_drop_tightening = "allow" # false positives on guards used until the end of the block

# ---------------------------------------------------------------------------
# Profiles.
# ---------------------------------------------------------------------------
[profile.dev]
# Dependencies at -O2 keep test/bench feedback loops fast; our own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
# `unwind`, not `abort`: the actor supervisor catches panics and restarts the shard from its snapshot.
panic = "unwind"
overflow-checks = true # arithmetic bugs must never wrap silently in a ledger

[profile.bench]
inherits = "release"
debug = true

# `cargo build --profile profiling` — release codegen with full symbols for perf/flamegraph.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

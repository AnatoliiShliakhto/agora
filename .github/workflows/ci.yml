name: CI

# Every job that has a local equivalent runs the same `just` recipe contributors run, so CI and
# `just verify` cannot drift — they did once, and a feature-only failure was invisible locally.
# `deny` and `typos` use their upstream actions instead (`just deny` / `just typos` locally).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: miri + fuzz smoke

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt + taplo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just,taplo-cli
      - run: just fmt-check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just lint

  features:
    name: clippy over every feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack
      - run: just lint-features
      # `--no-dev-deps` rewrites Cargo.toml as it runs and restores it; make sure the lockfile
      # really did come back untouched.
      - name: Cargo.lock must be unchanged
        run: git diff --exit-code Cargo.lock

  test:
    name: test (nextest + doctests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - run: just test
      - run: just test-doc

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just doc

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master

  bench-build:
    name: benches compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just bench-build

  miri:
    name: miri (nightly schedule)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # `rust-src` too: cargo-miri builds its own std and otherwise stops on an
          # interactive prompt asking to install it.
          components: miri, rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just miri

  fuzz-smoke:
    name: fuzz smoke (nightly schedule)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-fuzz
      - run: just fuzz matching_stream -- -max_total_time=600

  gate:
    name: all gates
    if: always()
    needs: [fmt, clippy, features, test, doc, deny, typos, bench-build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.fmt.result }}" = success \
            && test "${{ needs.clippy.result }}" = success \
            && test "${{ needs.features.result }}" = success \
            && test "${{ needs.test.result }}" = success \
            && test "${{ needs.doc.result }}" = success \
            && test "${{ needs.deny.result }}" = success \
            && test "${{ needs.typos.result }}" = success \
            && test "${{ needs.bench-build.result }}" = success
